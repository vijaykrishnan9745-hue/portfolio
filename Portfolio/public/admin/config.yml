# Decap CMS: a free editor that saves your content as files in your GitHub repo.
# Setup (once):
# 1. Create a GitHub repo, push this project to it, and put "vijaykrishnan9745-hue/portfolio" in `repo` below.
# 2. Deploy the repo on Netlify (free): build command `npm run build`, publish folder `dist`.
# 3. GitHub > Settings > Developer settings > OAuth Apps > New. Homepage URL = your site URL,
#    callback URL = https://api.netlify.com/auth/done. Copy the Client ID and generate a Client Secret.
# 4. Netlify > Site configuration > Access & security > OAuth > Install provider > GitHub, paste both.
# 5. Open https://your-site/admin and log in with GitHub. Every Publish commits and redeploys the site.
# To try it locally: run `npm run cms` in one terminal and `npm run dev` in another, then open /admin.
backend:
  name: github
  repo: vijaykrishnan9745-hue/portfolio
  branch: main

local_backend: true
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Home page
    files:
      - name: site
        label: Hero, contact and settings
        file: src/content/site.json
        fields:
          - { name: name, label: Your name, widget: string }
          - { name: role, label: Role, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: titleLine1, label: Headline, hint: "Left side of the hero", widget: string }
          - { name: titleLine2, label: Headline, hint: "Right side of the hero", widget: string }
          - { name: heroFact, label: Short intro line, widget: text }
          - { name: heroImage, label: Hero photo, widget: image }
          - { name: cvUrl, label: CV (PDF), widget: file }
          - { name: worksLabel, label: Works section title, widget: string }
          - { name: closingTitle, label: Closing title, widget: string }
          - { name: closingSub, label: Closing line, widget: string }
          - name: socials
            label: Social links
            widget: list
            fields:
              - { name: label, label: Name, widget: string }
              - { name: icon, label: Short label shown on the button, widget: string }
              - { name: url, label: URL, widget: string }
      - name: about
        label: About me
        file: src/content/about.json
        fields:
          - { name: label, label: Section label, widget: string }
          - { name: titleLine1, label: Title line 1, widget: string }
          - { name: titleLine2, label: Title line 2, widget: string }
          - { name: paragraphs, label: Paragraphs, widget: list, field: { name: text, label: Text, widget: text } }
          - { name: linkedin, label: LinkedIn URL, widget: string }
          - name: timeline
            label: Timeline
            widget: list
            fields:
              - { name: year, label: Years, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: note, label: Short note, widget: string }
          - name: gallery
            label: Photo carousel
            widget: list
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: Description, widget: string }
      - name: garden
        label: Sandbox (design garden)
        file: src/content/garden.json
        fields:
          - { name: label, label: Section label, widget: string }
          - { name: title, label: Title, widget: string }
          - { name: hint, label: Hint text, widget: string }
          - name: items
            label: Pieces
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: image, label: Image, widget: image }

  - name: projects
    label: Case studies
    folder: src/content/projects
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title (shown on the home page card), widget: string }
      - { name: order, label: Order on the home page, widget: number, value_type: int, default: 1 }
      - { name: tags, label: Tags, hint: "e.g. UX · UI · Design system", widget: string }
      - { name: summary, label: Card summary, hint: "One or two sentences under the title on the home page", widget: text }
      - { name: cover, label: Cover image, widget: image }
      - { name: heroTitle, label: Big headline on the case study page, hint: "Press Enter to split into two lines", widget: text, required: false }
      - { name: lede, label: Intro paragraph, widget: text, required: false }
      - { name: year, label: Year, widget: string }
      - { name: role, label: Role, widget: string }
      - { name: scope, label: Scope, widget: string }
      - { name: type, label: Type, widget: string }
      - { name: client, label: Client, widget: string }
      - name: sections
        label: Sections
        label_singular: Section
        hint: "Context, Problem, Role and process, Decisions, Interface, Result, Reflection... add as many as you like. They are numbered automatically and listed in the side menu."
        widget: list
        summary: "{{fields.label}}: {{fields.heading}}"
        fields:
          - { name: label, label: Section name, hint: "Shown in the side menu, e.g. Context", widget: string }
          - { name: heading, label: Section headline, hint: "Press Enter for a line break", widget: text }
          - name: blocks
            label: Content
            label_singular: Block
            hint: "Add text, images, quotes, stats and more in any order"
            widget: list
            types:
              - label: Text
                name: text
                widget: object
                summary: "{{fields.body}}"
                fields:
                  - { name: body, label: Text, hint: "Supports bold, links and lists. Leave a blank line between paragraphs.", widget: markdown, buttons: [bold, italic, link, bulleted-list, numbered-list], editor_components: [] }
              - label: Sub-heading
                name: subheading
                widget: object
                summary: "{{fields.text}}"
                fields:
                  - { name: text, label: Sub-heading, widget: string }
              - label: Images
                name: images
                widget: object
                summary: "{{fields.layout}}: {{fields.images.0}}"
                fields:
                  - name: layout
                    label: Layout
                    widget: select
                    default: single
                    options:
                      - { label: "One large image", value: single }
                      - { label: "Two side by side", value: two }
                      - { label: "Three side by side", value: three }
                      - { label: "Carousel (swipe and arrows)", value: carousel }
                  - { name: images, label: Images, hint: "Upload or pick several images at once. Drag to reorder.", widget: image, allow_multiple: true }
                  - { name: captions, label: Captions, hint: "One caption per line, in the same order as the images. Optional.", widget: text, required: false }
              - label: Quote
                name: quote
                widget: object
                summary: "{{fields.text}}"
                fields:
                  - { name: text, label: Quote, widget: text }
                  - { name: by, label: Who said it, widget: string, required: false }
              - label: Results and numbers
                name: stats
                widget: object
                summary: "{{fields.items.0.value}} ..."
                fields:
                  - name: items
                    label: Numbers
                    label_singular: Number
                    widget: list
                    summary: "{{fields.value}}: {{fields.label}}"
                    fields:
                      - { name: value, label: Big number or word, hint: "e.g. -40%, 3x, Shipped", widget: string }
                      - { name: label, label: What it means, widget: string }
              - label: Bullet list
                name: list
                widget: object
                summary: "{{fields.items.0}} ..."
                fields:
                  - { name: items, label: Points, widget: list, field: { name: item, label: Point, widget: string } }
              - label: Colour swatches
                name: colors
                widget: object
                summary: "{{fields.items.0.name}} ..."
                fields:
                  - name: items
                    label: Colours
                    widget: list
                    summary: "{{fields.name}} {{fields.hex}}"
                    fields:
                      - { name: name, label: Name, widget: string }
                      - { name: hex, label: Hex value, hint: "e.g. #3550FF", widget: string }
